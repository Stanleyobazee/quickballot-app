misconfigurations:
  - id: AWS-0132
    paths:
      - "bootstrap/main.tf"
      - "terraform/bootstrap/main.tf"
    statement: "State bucket uses SSE-S3 instead of a customer-managed KMS key. Accepted for a short-lived, single-account, cost-controlled environment. Revisit if state ever holds secrets or the environment becomes long-lived."

  - id: AWS-0039
    paths:
      - "main/eks.tf"
      - "terraform/main/eks.tf"
    statement: "EKS envelope-encrypts all Kubernetes API data by default with an AWS-owned key (Kubernetes 1.28 and later). A customer-managed key is the upgrade for a long-lived environment."

  - id: AWS-0040
    paths:
      - "main/eks.tf"
      - "terraform/main/eks.tf"
    statement: "The API endpoint must be reachable from the operator's workstation, which is outside the VPC. Public access is limited to explicit CIDR ranges and 0.0.0.0/0 is rejected. A private-only endpoint would need a VPN or bastion host."

  - id: AWS-0041
    paths:
      - "main/eks.tf"
      - "terraform/main/eks.tf"
    statement: "The API endpoint must be reachable from the operator's workstation, which is outside the VPC. Public access is limited to explicit CIDR ranges and 0.0.0.0/0 is rejected. A private-only endpoint would need a VPN or bastion host."

# Accepted image findings. Each entry expires so that it is re-checked; the
# reasons are recorded in the "Container image findings" table in README.md.
vulnerabilities:
  - id: CVE-2026-4738
    statement: "zlib in the Alpine base image of vote-ui and vote-api. The CVE concerns the infback9 module in the zlib copy bundled with GDAL; the images do not contain GDAL and the Alpine zlib package has no infback9 files. Fixed in Alpine zlib 1.4-r0; clears with a rebuild on a refreshed base image."
    expired_at: 2027-01-23

  - id: CVE-2026-95691
    statement: "openssl in the Alpine base image of vote-api, not an application dependency. Clears with a rebuild with --pull on a refreshed base image."
    expired_at: 2027-01-23

  - id: CVE-2026-88823
    statement: "openssl in the Alpine base image of vote-api, not an application dependency. Clears with a rebuild with --pull on a refreshed base image."
    expired_at: 2027-01-23

