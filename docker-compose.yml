services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - quickballot-network
    environment:
      POSTGRES_DB: quickballot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - quickballot-postgres-data:/var/lib/postgresql/data
      - ./scripts/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  vote-api:
    build: ./vote-api
    restart: unless-stopped
    networks:
      - quickballot-network
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: quickballot
      DB_USER: postgres
      DB_PASSWORD: postgres
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy

  results-api:
    build: ./results-api
    restart: unless-stopped
    networks:
      - quickballot-network
    ports:
      - "8000:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: quickballot
      DB_USER: postgres
      DB_PASSWORD: postgres
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy

  vote-ui:
    build: ./vote-ui
    restart: unless-stopped
    networks:
      - quickballot-network
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_VOTE_API_URL: http://localhost:8080
      NEXT_PUBLIC_RESULTS_API_URL: http://localhost:8000
    depends_on:
      - vote-api
      - results-api

networks:
  quickballot-network:
    driver: bridge

volumes:
  quickballot-postgres-data: