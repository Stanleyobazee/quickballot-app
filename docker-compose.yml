services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - quickballot-network
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set in .env}
    volumes:
      - quickballot-postgres-data:/var/lib/postgresql/data
      - ./scripts/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  vote-api:
    build: ./vote-api
    restart: unless-stopped
    networks:
      - quickballot-network
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set in .env}
      CORS_ALLOWED_ORIGINS: http://${PUBLIC_HOST:?PUBLIC_HOST is not set in .env}:3000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  results-api:
    build: ./results-api
    restart: unless-stopped
    networks:
      - quickballot-network
    ports:
      - "8000:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set in .env}
      CORS_ALLOWED_ORIGINS: http://${PUBLIC_HOST:?PUBLIC_HOST is not set in .env}:3000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  vote-ui:
    build: ./vote-ui
    restart: unless-stopped
    networks:
      - quickballot-network
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_VOTE_API_URL: http://${PUBLIC_HOST:?PUBLIC_HOST is not set in .env}:8080
      NEXT_PUBLIC_RESULTS_API_URL: http://${PUBLIC_HOST:?PUBLIC_HOST is not set in .env}:8000
      VOTE_API_INTERNAL_URL: http://vote-api:8080
      RESULTS_API_INTERNAL_URL: http://results-api:8000
    depends_on:
      vote-api:
        condition: service_healthy
      results-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://$$(hostname):3000/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  quickballot-network:
    driver: bridge

volumes:
  quickballot-postgres-data: