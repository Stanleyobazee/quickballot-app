apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Images use ${ECR_REGISTRY}; render with:
#   kubectl kustomize k8s/ | envsubst '$ECR_REGISTRY' | kubectl apply -f -
# The db-config ConfigMap and db-credentials Secret are created by
# scripts/deploy-k8s.sh and are not part of this repository.
namespace: quickballot

resources:
  - namespace.yaml
  - vote-api.yaml
  - results-api.yaml
  - vote-ui.yaml
  - ingress.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: quickballot
    includeSelectors: false
