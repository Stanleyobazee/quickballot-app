apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote-ui
  labels:
    app.kubernetes.io/name: vote-ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: vote-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vote-ui
        app.kubernetes.io/part-of: quickballot
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: vote-ui
      containers:
        - name: vote-ui
          image: ${ECR_REGISTRY}/quickballot/vote-ui:0.1.1
          ports:
            - name: http
              containerPort: 3000
          env:
            # Next.js binds to $HOSTNAME, which is the pod name by default.
            - name: HOSTNAME
              value: "0.0.0.0"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # /api/health answers without calling the backends, so a backend outage does not fail these probes.
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vote-ui
  labels:
    app.kubernetes.io/name: vote-ui
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vote-ui
  ports:
    - name: http
      port: 3000
      targetPort: http
