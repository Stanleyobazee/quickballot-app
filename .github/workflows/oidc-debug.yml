name: oidc-debug
on:
  pull_request:
    paths:
      - ".github/workflows/oidc-debug.yml"
permissions:
  id-token: write
  contents: read
jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - name: Show token claims
        run: |
          T=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$T" | python3 -c 'import sys,base64,json;p=sys.stdin.read().split(".")[1];p+="="*(-len(p)%4);d=json.loads(base64.urlsafe_b64decode(p));print({k:d.get(k) for k in ("iss","aud","sub","repository","repository_owner","ref","job_workflow_ref")})'
